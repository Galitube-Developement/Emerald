[package]
name = "emerald"
version = "1.2.9"
edition = "2021"
license = "MIT"
authors = ["Galitube Productions"]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = {version="4", features=["derive","env"]}
dirs = "6"
hex = "0.4"
rand = "0.8"
reqwest = {version="0.12", default-features=false, features=["blocking","json","rustls-tls"]}
serde = {version="1",features=["derive"]}
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = {version="1",features=["full"]}
walkdir = "2"
eframe = { version = "0.31", default-features = false, features = ["default_fonts","glow","x11","wayland"] }
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
egui_commonmark = { version = "0.20", default-features = false }
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
