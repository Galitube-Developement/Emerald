[package]
name = "emerald"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = {version="4", features=["derive","env"]}
dirs = "6"
hex = "0.4"
rand = "0.8"
reqwest = {version="0.12", default-features=false, features=["blocking","json","rustls-tls"]}
serde = {version="1",features=["derive"]}
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = {version="1",features=["full"]}
walkdir = "2"
webbrowser = "1"
pulldown-cmark = "0.13"
ammonia = "4"
