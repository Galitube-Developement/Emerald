name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  packages:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - run: cargo build --locked --release
      - name: Confirm the desktop client opens a native window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils libgl1-mesa-dri libxkbcommon-x11-0
          xvfb-run -a bash -eu -c '
            target/release/emerald --vault "$RUNNER_TEMP/emerald-smoke" &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            for attempt in {1..60}; do
              kill -0 "$pid"
              if xwininfo -root -tree | grep -Fq "\"Emerald\""; then exit 0; fi
              sleep 1
            done
            exit 1
          '

      - if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2
      - run: python packaging/package.py
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Sdk//25.08 org.freedesktop.Platform//25.08
          bash packaging/flatpak.sh
      - uses: actions/upload-artifact@v4
        with:
          name: emerald-${{ matrix.os }}
          path: |
            dist/*.msi
            dist/*.flatpak
            dist/*.deb
            dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: emerald-*
          path: installers
          merge-multiple: true
      - name: Publish tagged release with all installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd installers
          mv emerald.msi Emerald-Client_Windows_x64.msi
          mv emerald-server.msi Emerald-Server_Windows_x64.msi
          mv emerald-arm64.dmg Emerald-Client_macOS_Arm64.dmg
          mv emerald-server-arm64.dmg Emerald-Server_macOS_Arm64.dmg
          mv emerald-x86_64.dmg Emerald-Client_macOS_Intel_x64.dmg
          mv emerald-server-x86_64.dmg Emerald-Server_macOS_Intel_x64.dmg
          mv emerald-amd64.deb Emerald-Client_Linux_x64.deb
          mv emerald-server-amd64.deb Emerald-Server_Linux_x64.deb
          mv emerald.flatpak Emerald-Client_Linux_x64.flatpak
          assets=(Emerald-Client_Windows_x64.msi Emerald-Server_Windows_x64.msi Emerald-Client_macOS_Arm64.dmg Emerald-Server_macOS_Arm64.dmg Emerald-Client_macOS_Intel_x64.dmg Emerald-Server_macOS_Intel_x64.dmg Emerald-Client_Linux_x64.deb Emerald-Server_Linux_x64.deb Emerald-Client_Linux_x64.flatpak)
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS
          gh release create "$TAG" "${assets[@]}" SHA256SUMS --verify-tag --repo "$GITHUB_REPOSITORY" --title "Emerald $TAG" --notes "Rust Markdown client and self-hosted sync server. Install the client on each desktop and the server on the machine that stores the shared vault. Setup instructions are in the README. Installers are unsigned."
